<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cojone!</title>
    <style>
        /* Imposta lo sfondo scuro e centra tutto perfettamente nello schermo */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        /* Scritta principale grande, in grassetto con effetto arcobaleno */
        h1 {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 0 0 15px 0;
            background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Piccola descrizione sotto */
        p {
            font-size: 1.2rem;
            color: #b0b0b0;
            margin: 0;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <h1>SEI STATO PHISHATO!!</h1>
    <p>Brutto monogoloide non cliccare link a caso!</p>

</body>
</html>
